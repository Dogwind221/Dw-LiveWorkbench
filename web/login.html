<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 普洱茶直播工作台</title>
<style>
  :root {
    --ink: #16302b; --primary: #2f5d50; --primary-l: #4a8574;
    --cream: #f7f4ee; --paper: #ffffff; --text: #22302b; --muted: #6e7c76;
    --line: #dfe6e2; --red: #b3552e; --radius: 10px;
    --font: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(1200px 600px at 50% -10%, #e8f0ec 0%, var(--cream) 55%, #f2ede4 100%);
    font-family: var(--font); color: var(--text);
  }
  .card {
    width: min(92vw, 380px); background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 28px 26px 24px;
    box-shadow: 0 1px 2px rgba(22,48,43,.06), 0 12px 40px rgba(22,48,43,.10);
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); }
  h1 { font-size: 17px; margin: 0; letter-spacing: .02em; color: var(--ink); }
  .sub { margin: 2px 0 22px; font-size: 12.5px; color: var(--muted); }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 14px; font-family: var(--font);
    border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: #fff;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--primary-l); box-shadow: 0 0 0 3px rgba(74,133,116,.14); }
  .field { margin-bottom: 14px; }
  button {
    width: 100%; padding: 11px 14px; font-size: 14px; font-weight: 700; font-family: var(--font);
    color: #fff; background: var(--primary); border: none; border-radius: 7px; cursor: pointer;
    transition: background .15s;
  }
  button:hover:not(:disabled) { background: #274f44; }
  button:disabled { opacity: .6; cursor: default; }
  .err {
    display: none; margin: 0 0 14px; padding: 9px 12px; font-size: 12.5px; line-height: 1.5;
    color: var(--red); background: #fbeeea; border: 1px solid #f0d5cc; border-radius: 7px;
  }
  .err.show { display: block; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .foot code {
    background: #eef1f0; padding: 1px 5px; border-radius: 4px;
    font-family: Consolas, "Cascadia Mono", monospace; font-size: 11.5px;
  }
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
  <div class="brand"><span class="dot"></span><h1>直播工作台</h1></div>
  <p class="sub">普洱茶 · 内容与转化</p>

  <div class="err" id="err"></div>

  <div class="field">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
  </div>
  <div class="field">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>

  <button id="submit" type="submit">登录</button>

  <p class="foot">
    首次使用：启动日志里会打印初始管理员账号密码。<br>
    也可以在命令行创建用户：<code>node scripts/create-user.mjs</code>
  </p>
</form>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const form = $('form');
  const err = $('err');
  const btn = $('submit');

  function showErr(msg) {
    err.textContent = msg;
    err.classList.add('show');
  }
  function hideErr() {
    err.classList.remove('show');
  }

  // 已登录就直接进主界面，避免"登录了还看到登录页"
  fetch('./api/auth/me', { headers: { accept: 'application/json' } })
    .then((r) => r.json())
    .then((j) => {
      if (j && j.authenticated) location.replace('./');
    })
    .catch(() => { /* 忽略：正常展示表单 */ });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideErr();
    const username = $('username').value.trim();
    const password = $('password').value;
    if (!username || !password) return showErr('用户名和密码都要填');

    btn.disabled = true;
    btn.textContent = '登录中…';
    try {
      const res = await fetch('./api/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json', accept: 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showErr(data.message || `登录失败（HTTP ${res.status}）`);
        btn.disabled = false;
        btn.textContent = '登录';
        return;
      }
      location.replace('./');
    } catch (ex) {
      showErr('网络错误：' + (ex.message || ex));
      btn.disabled = false;
      btn.textContent = '登录';
    }
  });
})();
</script>
</body>
</html>
